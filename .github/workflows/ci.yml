name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Checks (svelte-check, tests, clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      # Tauri's Linux build dependencies (the app crate links webkit2gtk even for `cargo test`).
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev libayatana-appindicator3-dev libxdo-dev patchelf

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: svelte-check
        run: pnpm check

      - name: frontend unit tests (node --test)
        run: pnpm test

      - name: cargo test (workspace, all features)
        run: cargo test --workspace --all-features

      - name: cargo clippy (deny warnings)
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings

  android-release:
    name: Android signed release APK
    runs-on: ubuntu-latest
    env:
      # Empty on PRs from forks (no secrets): the build then stays unsigned and the verify step fails loudly.
      ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # Fixed release key (D-021): every build is signed with the same certificate, so build N+1 installs over N.
      - name: Set up signing
        if: env.ANDROID_KEY_BASE64 != ''
        run: |
          base64 -d <<< "$ANDROID_KEY_BASE64" > "$RUNNER_TEMP/keystore.jks"
          {
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "password=$ANDROID_KEY_PASSWORD"
            echo "storeFile=$RUNNER_TEMP/keystore.jks"
          } > src-tauri/gen/android/keystore.properties

      # versionCode = run number: strictly increasing, so an update is never a downgrade.
      # Never rename this workflow file: the run number restarts at 1 for a new workflow (D-021).
      - name: Build signed release APK (arm64)
        env:
          NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.2.12479018
          VERSION_CODE: ${{ github.run_number }}
        run: |
          pnpm tauri android build --apk --target aarch64 \
            -c "{\"bundle\":{\"android\":{\"versionCode\":$VERSION_CODE}}}"
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          mkdir -p out
          cp src-tauri/gen/android/app/build/outputs/apk/*/release/*.apk "out/checkflat-$VERSION-$VERSION_CODE-arm64.apk"

      - name: Verify signature and version
        run: |
          APK=$(ls out/*.apk)
          BT="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          "$BT/apksigner" verify --print-certs "$APK" | tee certs.txt
          { echo "### $(basename "$APK")"; echo;
            "$BT/aapt2" dump badging "$APK" | grep -E "^package:" ;
            echo; echo '```'; grep -E "SHA-256" certs.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: out/*.apk
          if-no-files-found: error

  # Spike C size comparison: three release APKs (both / typst only / printpdf only).
  # Manual only (workflow_dispatch) — too slow for every push, and the numbers only matter when the engine choice is revisited.
  android-size:
    name: Android release APK sizes (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Prepare output dir
        run: mkdir -p out

      # Spike C: shipped size per report engine. Release profile (LTO, opt-level z, strip), unsigned APK —
      # only the size is of interest. The engine set comes from tauri.conf.json `build.features`,
      # overridden per variant with `-c` (the Tauri CLI has no --no-default-features).
      - name: Release APK size — both engines
        env:
          NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.2.12479018
        run: |
          pnpm tauri android build --apk --target aarch64
          cp src-tauri/gen/android/app/build/outputs/apk/*/release/*.apk out/checkflat-release-both.apk
      - name: Release APK size — typst only
        env:
          NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.2.12479018
        run: |
          pnpm tauri android build --apk --target aarch64 -c '{"build":{"features":["report-typst"]}}'
          cp src-tauri/gen/android/app/build/outputs/apk/*/release/*.apk out/checkflat-release-typst.apk
      - name: Release APK size — printpdf only
        env:
          NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.2.12479018
        run: |
          pnpm tauri android build --apk --target aarch64 -c '{"build":{"features":["report-printpdf"]}}'
          cp src-tauri/gen/android/app/build/outputs/apk/*/release/*.apk out/checkflat-release-printpdf.apk

      - name: APK sizes
        run: |
          { echo "### APK sizes (aarch64)"; echo; echo '| variant | bytes | MB |'; echo '|---|---|---|';
            for f in out/*.apk; do b=$(stat -c %s "$f"); echo "| $(basename "$f") | $b | $(awk "BEGIN{printf \"%.1f\", $b/1048576}") |"; done; } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: android-release-apks
          path: out/*.apk
          if-no-files-found: error

  windows:
    name: Windows NSIS installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Spike C unit tests (both engines)
        run: cargo test -p report-spike --features typst,printpdf

      - name: Build NSIS installer
        run: pnpm tauri build --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: windows-nsis
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
