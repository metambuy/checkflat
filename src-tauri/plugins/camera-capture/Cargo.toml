[package]
name = "tauri-plugin-camera-capture"
version = "0.1.0"
authors = ["Checkflat"]
description = "Minimal Tauri mobile plugin: take a photo with the system camera app (ACTION_IMAGE_CAPTURE) and return the file path."
edition = "2021"
rust-version = "1.85"
publish = false
links = "tauri-plugin-camera-capture"

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

# Desktop only: the report's Open hands the file to the default PDF app (ShellExecuteExW on
# Windows, D-029). Not compiled into the APK.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
open = { version = "5", features = ["shellexecute-on-windows"] }
