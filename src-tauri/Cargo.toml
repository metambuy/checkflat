[package]
name = "checkflat"
version = "0.0.1"
description = "Checkflat — site-visit reports"
edition = "2021"
rust-version = "1.85"

[lib]
name = "checkflat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
report-spike = { path = "../spikes/report-spike", default-features = false }
tauri-plugin-camera-capture = { path = "plugins/camera-capture" }
checkflat-core = { path = "../crates/checkflat-core" }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
log = "0.4"

[features]
# No default engines: tauri.conf.json `build.features` selects them (CI overrides it per variant with `-c`).
default = []
report-typst = ["report-spike/typst"]
report-printpdf = ["report-spike/printpdf"]
