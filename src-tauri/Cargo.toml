[package]
name = "checkflat"
version = "0.1.0"
description = "Checkflat — site-visit reports"
edition = "2021"
rust-version = "1.85"

[lib]
name = "checkflat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Local measurement builds only (D-026): compiles the Dev → Seed command into a release build and
# copies each report to the adb-readable Documents dir. CI never enables it; the android-release
# job fails if the command name is found in the APK.
dev-seed = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tauri-plugin-camera-capture = { path = "plugins/camera-capture" }
checkflat-core = { path = "../crates/checkflat-core" }
checkflat-report = { path = "../crates/checkflat-report" }
# Only the seed command (debug or `dev-seed` builds) uses it directly (the core compiles it in anyway).
image = { version = "0.25", default-features = false, features = ["jpeg"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
log = "0.4"

# Desktop only (not compiled into the APK): the message shown when the app cannot start (startup.rs).
# Same features as tauri-plugin-dialog's own rfd, so the build is one.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
rfd = { version = "0.16", default-features = false, features = ["common-controls-v6"] }

[dev-dependencies]
tempfile = "3"
# Same matcher and options as Tauri's asset-protocol scope (tauri/src/scope/fs.rs), for the scope test.
glob = "0.3"
