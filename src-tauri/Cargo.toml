[package]
name = "checkflat"
version = "0.0.1"
description = "Checkflat — site-visit reports"
edition = "2021"
rust-version = "1.85"

[lib]
name = "checkflat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tauri-plugin-camera-capture = { path = "plugins/camera-capture" }
checkflat-core = { path = "../crates/checkflat-core" }
checkflat-report = { path = "../crates/checkflat-report" }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
log = "0.4"

[dev-dependencies]
# Same matcher and options as Tauri's asset-protocol scope (tauri/src/scope/fs.rs), for the scope test.
glob = "0.3"
