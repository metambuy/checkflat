[package]
name = "checkflat-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Checkflat storage core: SQLite schema, migrations, repositories, path policy, PDF metadata. No Tauri dependency."
publish = false

[dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6"
uuid = { version = "1", features = ["v7", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
lopdf = { version = "0.45", default-features = false }
log = "0.4"

[dev-dependencies]
tempfile = "3"
