[package]
name = "checkflat-report"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Checkflat report: plan snapshots stitched from the tile cache and the Typst PDF (Sprint 5). No Tauri dependency."
publish = false

[dependencies]
checkflat-core = { path = "../checkflat-core" }
# Engine choice D-004; integration D-024 (typst-as-lib stays: `typst` itself pulls typst-html/typst-svg).
typst = "0.15"
typst-layout = "0.15" # `PagedDocument` lives here, not re-exported by `typst`
typst-pdf = "0.15"
typst-as-lib = "0.16"
# Typst memoizes every decoded image; `comemo::evict(0)` after a compile releases them.
comemo = "0.5"
# Time zones for captions (D-024): Android's system tzdata, bundled only on Windows.
jiff = "0.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
